---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date: "%Y-%m-%d" }}</p>
  
  {% if page.labels %}
    <div class="labels">
      {% for label in page.labels %}
        <span class="label-tag">{{ label }}</span>
      {% endfor %}
    </div>
  {% endif %}

  <div class="content">
    {{ content }}
  </div>
</article>
