---
layout: default
title: الرئيسية
---

<h1>📝 أحدث المقالات</h1>

{% for post in site.posts %}
  <div class="post-preview">
    <h2>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </h2>
    <p class="post-meta">
      {{ post.date | date: "%Y-%m-%d" }}
      {% if post.labels %}
        | {% for label in post.labels %}
          <span class="label-tag">{{ label }}</span>
        {% endfor %}
      {% endif %}
    </p>
    <p>{{ post.excerpt }}</p>
  </div>
{% endfor %}
