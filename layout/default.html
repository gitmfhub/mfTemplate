<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    {% include head.html %}
</head>
<body>
    <!-- رأس الموقع (اختياري) -->
    <header>
        <div class="container">
            <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
            <nav>
                <ul>
                    <li><a href="{{ '/' | relative_url }}">الرئيسية</a></li>
                    <li><a href="{{ '/about' | relative_url }}">عن الموقع</a></li>
                    <li><a href="{{ '/contact' | relative_url }}">اتصل بنا</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main>
        <div class="container">
            {{ content }}
        </div>
    </main>

    <!-- تذييل الموقع -->
    <footer>
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} - جميع الحقوق محفوظة</p>
            <p><a href="{{ '/privacy' | relative_url }}">سياسة الخصوصية</a></p>
        </div>
    </footer>
</body>
</html>
